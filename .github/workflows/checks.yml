name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - name: Install development and project dependencies
        run: >-
          python -m pip install -r requirements-dev.txt
          -r advanced_concepts/quantum_cryptanalysis/requirements.txt
          -r bonus/enigma_gui/requirements.txt
      - name: Run all project suites (including optional backends)
        run: python -m unittest discover -v
